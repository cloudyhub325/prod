<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products | Cloudy Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' }
</script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition">

<!-- Header -->
<header class="bg-black text-white p-6 flex justify-between items-center">
  <div>
    <h1 class="text-3xl font-bold">Cloudy Hub</h1>
    <p class="text-gray-400">Product Showcase</p>
  </div>
  <button onclick="toggleDark()" class="bg-gray-700 px-4 py-2 rounded-lg">🌙</button>
</header>

<!-- Navigation -->
<nav class="bg-gray-200 dark:bg-gray-800 p-4 flex justify-center gap-6 font-medium">
  <a href="index.html" class="hover:underline">Home</a>
  <a href="products.html" class="underline">Products</a>
  <a href="about.html" class="hover:underline">About</a>
</nav>

<!-- Controls -->
<section class="p-6 max-w-6xl mx-auto flex gap-4 items-center">
  <input id="search" type="text" placeholder="Search products..." class="p-3 rounded-lg shadow dark:bg-gray-800 flex-1" />
  <select id="categoryFilter" class="p-3 rounded-lg shadow dark:bg-gray-800">
    <option value="retail">Retail</option>
    <option value="wholesale">Wholesale</option>
  </select>
</section>

<!-- Product Grid -->
<main class="p-6 max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="productGrid"></main>

<!-- Retail Product Modal -->
<div id="productModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
  <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md w-full relative">
    <button onclick="closeProductModal()" class="absolute top-3 right-3 text-gray-500">✖</button>
    <img id="modalImg" class="w-full h-48 object-cover rounded-lg mb-4" />
    <h2 id="modalTitle" class="text-2xl font-bold mb-2"></h2>
    <p id="modalDescription" class="mb-4 text-gray-700 dark:text-gray-300"></p>
    <p id="modalPrice" class="font-semibold mb-4"></p>
    <a id="modalOrderBtn" target="_blank" class="block text-center bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl">Order via Messenger</a>
  </div>
</div>

<!-- Footer -->
<footer class="text-center p-6 text-gray-500">
  © 2026 Cloudy Hub • Hosted on GitHub Pages
</footer>

<script>
  // Dark Mode
  if (localStorage.getItem("darkMode") === "true") document.documentElement.classList.add("dark");
  function toggleDark() {
    const isDark = document.documentElement.classList.toggle("dark");
    localStorage.setItem("darkMode", isDark);
  }

  const fbUsername = "Zedric651";

  // Retail products with descriptions
  const imageFiles = [
  "images/RedPulp_Product_Watermelon.png",
"images/Kool-Aid_Product_RainbowPunch.png",
"images/VeryBaguio_Product_Strawberry.png",
"images/GreenTokyo_Product_Matcha.png",
"images/BacteriaMonster_Product_Yakult.png",
"images/YellowSummer_Product_Mango.png",
"images/SweetForest_Product_GreenApple.png",
"images/StickyWorms_Product_GummyWorms.png",
"images/YellowGreen_Product_LemonLime.png",
"images/BlackWave_Product_BlackCurrant.png",
"images/TroublePurple_Product_Grapes.png",
"images/VeryMore_Product_Mixedberries.png",
"images/TangyPlump_Product_Nerdz.png",
"images/RoundMelo_Product_Melon.png"

];

// Function to extract product name and flavor from image
function parseImageName(imgPath){
  const filename = imgPath.split("/").pop();
  const parts = filename.split("_");
  const productName = parts[0];
  const flavor = parts[2].split(".")[0];
  return { productName, flavor };
}

// Generate retail products dynamically
const retailProducts = imageFiles.map(img => {
  const { productName, flavor } = parseImageName(img);
  return {
    name: productName,
    price: 250, // default price
    img: img,
    description: `Flavor: ${flavor}`
  };
});

  // Wholesale boxes
  const wholesaleBoxes = [
    { name: "1 Box", pcs: 10, price: 2200 },
    { name: "2 Box", pcs: 20, price: 4400 },
    { name: "3 Box", pcs: 30, price: 6600 },
    { name: "4 Box", pcs: 40, price: 8800 },
    { name: "5 Box", pcs: 50, price: 11000 },
    { name: "6 Box", pcs: 60, price: 13200 },
    { name: "7 Box", pcs: 70, price: 15400 },
    { name: "8 Box", pcs: 80, price: 17600 },
    { name: "9 Box", pcs: 90, price: 19800 },
    { name: "10 Box", pcs: 100, price: 22000 },
  ];

  const grid = document.getElementById("productGrid");
  const search = document.getElementById("search");
  const filter = document.getElementById("categoryFilter");

  const productModal = document.getElementById("productModal");
  const modalImg = document.getElementById("modalImg");
  const modalTitle = document.getElementById("modalTitle");
  const modalDescription = document.getElementById("modalDescription");
  const modalPrice = document.getElementById("modalPrice");
  const modalOrderBtn = document.getElementById("modalOrderBtn");

  function renderProducts(list) {
    grid.innerHTML = "";

    if(filter.value === "retail") {
      list.forEach((p) => {
        const card = document.createElement("div");
        card.className = "bg-white dark:bg-gray-800 p-5 rounded-2xl shadow hover:shadow-xl transition cursor-pointer";
        card.innerHTML = `
          <img src="${p.img}" class="w-full h-40 object-cover rounded-lg mb-3" />
          <h3 class="text-xl font-semibold">${p.name}</h3>
          <p class="mt-2 text-gray-600 dark:text-gray-300">${p.description}</p>
          <p class="mt-3 font-bold">₱${p.price}</p>
        `;
        card.onclick = () => openProductModal(p);
        grid.appendChild(card);
      });
    } else {
      // Wholesale boxes
      list.forEach((b) => {
        const boxCard = document.createElement("div");
        boxCard.className = "bg-white dark:bg-gray-800 p-5 rounded-2xl shadow hover:shadow-xl transition cursor-pointer";
        boxCard.innerHTML = `
          <h3 class="text-xl font-semibold">${b.name}</h3>
          <p class="mt-2">${b.pcs} pcs</p>
          <p class="mt-1 font-bold">₱${b.price}</p>
        `;
        boxCard.onclick = () => {
          const message = `Hi! I'm interested in ${b.name} (${b.pcs} pcs, ₱${b.price})`;
          window.open(`https://m.me/${fbUsername}?text=${encodeURIComponent(message)}`, "_blank");
        };
        grid.appendChild(boxCard);
      });
    }
  }

  function openProductModal(p) {
    modalImg.src = p.img;
    modalTitle.innerText = p.name;
    modalDescription.innerText = p.description;
    modalPrice.innerText = `₱${p.price}`;
    modalOrderBtn.href = `https://m.me/${fbUsername}?text=${encodeURIComponent(`Hi! I'm interested in ${p.name} (₱${p.price}). I will specify quantity/flavor.`)}`;
    productModal.classList.remove("hidden");
    productModal.classList.add("flex");
  }

  function closeProductModal() {
    productModal.classList.add("hidden");
    productModal.classList.remove("flex");
  }

  // Search/filter
  function applyFilters(){
    const text = search.value.toLowerCase();
    if(filter.value === "retail") {
      renderProducts(retailProducts.filter(p => p.name.toLowerCase().includes(text)));
    } else {
      renderProducts(wholesaleBoxes.filter(b => b.name.toLowerCase().includes(text)));
    }
  }

  search.addEventListener("input", applyFilters);
  filter.addEventListener("change", applyFilters);

  renderProducts(retailProducts);
</script>
</body>
</html>
