<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudy Hub | Home</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition">

  <!-- Header -->
  <header class="bg-black text-white p-6 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold">Cloudy Hub</h1>
      <p class="text-gray-400">Welcome to our store</p>
    </div>
    <button onclick="toggleDark()" class="bg-gray-700 px-4 py-2 rounded-lg">🌙</button>
  </header>

  <!-- Navigation -->
  <nav class="bg-gray-200 dark:bg-gray-800 p-4 flex justify-center gap-6 font-medium">
    <a href="index.html" class="underline">Home</a>
    <a href="products.html" class="hover:underline">Products</a>
    <a href="about.html" class="hover:underline">About</a>
  </nav>

  <!-- Landing Content -->
  <main class="max-w-4xl mx-auto p-6 space-y-6">
    <h2 class="text-3xl font-bold text-center">Welcome!</h2>
    <p class="text-gray-600 dark:text-gray-300 text-center">
      Cloudy Hub is your go-to shop for quality and affordable products.
      Browse our products or contact us on Messenger!
    </p>

    <!-- Product Slideshow -->
    <div class="relative w-full max-w-3xl mx-auto overflow-hidden rounded-2xl shadow-lg">
      <div id="slideshow" class="flex transition-transform duration-500">
        <!-- Slides inserted by JS -->
      </div>
      <!-- Controls -->
      <button id="prev" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-gray-700 bg-opacity-50 text-white px-3 py-1 rounded-full">◀</button>
      <button id="next" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-gray-700 bg-opacity-50 text-white px-3 py-1 rounded-full">▶</button>
    </div>

    <div class="text-center mt-4">
      <a href="products.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl">
        Explore Products
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center p-6 text-gray-500">
    © 2026 Cloudy Hub • Hosted on GitHub Pages
  </footer>

  <!-- Dark Mode Script -->
  <script>
    if (localStorage.getItem("darkMode") === "true") {
      document.documentElement.classList.add("dark");
    }

    function toggleDark() {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("darkMode", isDark);
    }
  </script>

  <!-- Slideshow Script -->
  <script>
    const products = [
      { name: "Sweet Forest", img: "images/SweetForest_Product_GreenApple.jpg" },
      { name: "Green Tokyo", img: "images/GreenTokyo_Product_Matcha.jpg" },
      { name: "Round Melo", img: "images/RoundMelo_Product_Melon.jpg" },
      { name: "Bacteria Monster", img: "images/BacteriaMonster_Product_Yakult.jpg" },
      { name: "Red Pulp", img: "images/RedPulp_Product_Watermelon.jpg" }
    ];

    const slideshow = document.getElementById("slideshow");

    // Insert slides
    products.forEach(p => {
      const slide = document.createElement("div");
      slide.className = "flex-shrink-0 w-full";
      slide.innerHTML = `
        <img src="${p.img}" alt="${p.name}" class="w-full h-64 object-cover">
        <p class="text-center font-semibold mt-2">${p.name}</p>
      `;
      slideshow.appendChild(slide);
    });

    let currentIndex = 0;
    const totalSlides = products.length;

    function showSlide(index) {
      slideshow.style.transform = `translateX(-${index * 100}%)`;
    }

    document.getElementById("prev").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
      showSlide(currentIndex);
    });

    document.getElementById("next").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % totalSlides;
      showSlide(currentIndex);
    });

    // Auto-slide every 5s
    setInterval(() => {
      currentIndex = (currentIndex + 1) % totalSlides;
      showSlide(currentIndex);
    }, 5000);
  </script>

</body>
</html>
