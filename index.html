<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JZ Papa | Product Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition">

  <!-- Header -->
  <header class="bg-black text-white p-6 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold">JZ Papa</h1>
      <p class="text-gray-400">Interactive Product Showcase</p>
    </div>
    <button onclick="toggleDark()" class="bg-gray-700 px-4 py-2 rounded-lg">🌙</button>
  </header>

  <!-- Navigation (optional) -->
  <nav class="bg-gray-200 dark:bg-gray-800 p-4 flex justify-center gap-4">
    <a href="index.html" class="hover:underline">Home</a>
    <a href="products.html" class="hover:underline">Products</a>
    <a href="about.html" class="hover:underline">About</a>
  </nav>

  <!-- Controls -->
  <section class="p-6 max-w-6xl mx-auto grid md:grid-cols-2 gap-4">
    <input id="search" type="text" placeholder="Search products..." class="p-3 rounded-lg shadow dark:bg-gray-800" />
    <select id="categoryFilter" class="p-3 rounded-lg shadow dark:bg-gray-800">
      <option value="all">All</option>
      <option value="product">Products</option>
      <option value="service">Services</option>
    </select>
  </section>

  <!-- Product Grid -->
  <main class="p-6 max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="productGrid"></main>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center">
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md w-full relative">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-500">✖</button>
      <img id="modalImg" class="w-full h-48 object-cover rounded-lg mb-4" />
      <h2 id="modalTitle" class="text-2xl font-bold mb-2"></h2>
      <p id="modalDesc" class="text-gray-600 dark:text-gray-300 mb-4"></p>
      <p id="modalPrice" class="font-semibold mb-4"></p>
      <a id="orderBtn" target="_blank" class="block text-center bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl">Order via Messenger</a>
    </div>
  </div>

  <!-- Admin Table -->
  <section class="p-6 max-w-6xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Admin Product List</h2>
    <div class="overflow-x-auto">
      <table class="w-full border dark:border-gray-700">
        <thead class="bg-gray-200 dark:bg-gray-700">
          <tr>
            <th class="p-3 text-left">Name</th>
            <th class="p-3">Type</th>
            <th class="p-3">Price</th>
          </tr>
        </thead>
        <tbody id="adminTable"></tbody>
      </table>
    </div>
  </section>

  <footer class="text-center p-6 text-gray-500">
    © 2026 JZ Papa • Hosted on GitHub Pages
  </footer>

  <script>
  // Your Facebook Messenger username (not full URL)
  const fbUsername = "Zedric651";

  // Products
const products = [
  { name: "Product 1", desc: "High quality product for daily use.", price: "₱250", type: "product", img: "images/V1_Product.png" },
  { name: "Product 2", desc: "Affordable and reliable.", price: "₱180", type: "product", img: "images/V2_Product.png" },
  { name: "Product 3", desc: "Premium quality, limited edition.", price: "₱500", type: "product", img: "images/V3_Product.png" },
  { name: "Product 4", desc: "Eco-friendly and sustainable.", price: "₱220", type: "product", img: "images/V4_Product.png" },
  { name: "Product 5", desc: "Compact and portable design.", price: "₱300", type: "product", img: "images/V5_Product.png" },
  { name: "Product 6", desc: "Durable and long-lasting.", price: "₱400", type: "product", img: "images/V6_Product.png" },
  { name: "Product 7", desc: "Affordable starter kit.", price: "₱150", type: "product", img: "images/V7_Product.png" },
  { name: "Product 8", desc: "High-tech and modern design.", price: "₱600", type: "product", img: "images/V8_Product.png" },
  { name: "Product 9", desc: "Perfect for gifts.", price: "₱350", type: "product", img: "images/V9_Product.png" },
  { name: "Product 10", desc: "User-friendly and simple.", price: "₱200", type: "product", img: "images/V10_Product.png" },
  { name: "Service 1", desc: "Remote & on-site IT support.", price: "Contact", type: "service", img: "images/V11_Service.png" },
  { name: "Service 2", desc: "Custom web design services.", price: "Contact", type: "service", img: "images/V12_Service.png" },
  { name: "Service 3", desc: "SEO optimization for your business.", price: "Contact", type: "service", img: "images/V13_Service.png" },
  { name: "Service 4", desc: "Photography & videography.", price: "Contact", type: "service", img: "images/V14_Service.png" },
  { name: "Service 5", desc: "Social media management.", price: "Contact", type: "service", img: "images/V15_Service.png" },
  { name: "Product 11", desc: "Latest tech gadget.", price: "₱450", type: "product", img: "images/V16_Product.png" },
  { name: "Product 12", desc: "Smart home essentials.", price: "₱550", type: "product", img: "images/V17_Product.png" },
  { name: "Product 13", desc: "Ergonomic and stylish.", price: "₱380", type: "product", img: "images/V18_Product.png" },
  { name: "Product 14", desc: "Portable and lightweight.", price: "₱270", type: "product", img: "images/V19_Product.png" },
  { name: "Product 15", desc: "Premium quality accessories.", price: "₱320", type: "product", img: "images/V20_Product.png" }
];


  const grid = document.getElementById('productGrid');
  const search = document.getElementById('search');
  const filter = document.getElementById('categoryFilter');
  const admin = document.getElementById('adminTable');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');
  const modalPrice = document.getElementById('modalPrice');
  const orderBtn = document.getElementById('orderBtn');

  // Render product cards
  function renderProducts(list) {
    grid.innerHTML = '';
    list.forEach(p => {
      const card = document.createElement('div');
      card.className = 'bg-white dark:bg-gray-800 p-5 rounded-2xl shadow hover:shadow-xl transition cursor-pointer';
      card.innerHTML = `
        <img src="${p.img}" class="w-full h-40 object-cover rounded-lg mb-3" />
        <h3 class="text-xl font-semibold">${p.name}</h3>
        <p class="text-gray-600 dark:text-gray-300">${p.desc}</p>
        <p class="mt-3 font-bold">${p.price}</p>
      `;
      card.onclick = () => openModal(p);
      grid.appendChild(card);
    });
  }

  // Render admin table
  function renderAdmin() {
    admin.innerHTML = '';
    products.forEach(p => {
      admin.innerHTML += `
        <tr class="border-t dark:border-gray-700">
          <td class="p-3">${p.name}</td>
          <td class="p-3 text-center">${p.type}</td>
          <td class="p-3 text-center">${p.price}</td>
        </tr>`;
    });
  }

  // Open modal
  function openModal(p) {
    modalTitle.innerText = p.name;
    modalDesc.innerText = p.desc;
    modalPrice.innerText = 'Price: ' + p.price;
    modalImg.src = p.img;

    // Messenger link with pre-filled message
    const message = `Hi! I'm interested in ${p.name} (${p.price})`;
    orderBtn.href = `https://m.me/${fbUsername}?text=${encodeURIComponent(message)}`;

    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  // Close modal
  function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  // Dark mode toggle
  function toggleDark() {
    document.documentElement.classList.toggle('dark');
  }

  // Search & filter
  function applyFilters() {
    const text = search.value.toLowerCase();
    const cat = filter.value;
    renderProducts(products.filter(p =>
      p.name.toLowerCase().includes(text) && (cat === 'all' || p.type === cat)
    ));
  }

  search.addEventListener('input', applyFilters);
  filter.addEventListener('change', applyFilters);

  // Initial render
  renderProducts(products);
  renderAdmin();
  </script>
</body>
</html>
